name: Build Release Artifact

on:
  workflow_call:
  
env:
  APK_PATH: app/build/outputs/apk/release/app-release.apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pull upstream 🌏
        uses: actions/checkout@v4
        with:
          repository: DokiTeam/Doki
          ref: base
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update extension repository reference 🔧
        run: |
          if [ ! -f app/build.gradle ]; then
            echo "Error: app/build.gradle not found"
            exit 1
          fi
          if ! grep -q "com\.github\.DokiTeam:doki-exts" app/build.gradle; then
            echo "Error: Expected pattern 'com.github.DokiTeam:doki-exts' not found in app/build.gradle"
            exit 1
          fi
          sed -i 's/com\.github\.DokiTeam:doki-exts/com\.github\.thefirst632student:doki-exts/g' app/build.gradle
          echo "Successfully updated extension repository reference"

      - name: Set up JDK 🚀
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 🚀
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK 🚀
        uses: android-actions/setup-android@v3

      - name: Get Extension SHA and Build Release APK (Attempt 1) 💻
        run: |
          EXT_SHA=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github.sha" https://api.github.com/repos/thefirst632student/doki-exts/commits/base | cut -c -10)
          
          if [[ ! "$EXT_SHA" =~ ^[0-9a-f]{7,10}$ ]]; then
            echo "Error: Failed to fetch valid SHA, received: $EXT_SHA"
            exit 1
          fi
          
          echo "Successfully fetched extension SHA: $EXT_SHA"
          
          ./gradlew assembleRelease \
          -Dtg_backup_bot_token=$(curl -s https://dragonx943.github.io/waydroid_x86_64/value.json) \
          -Dgh_username=${{ github.repository_owner }} \
          -Dexts=$EXT_SHA
        continue-on-error: true

      - name: Build Release APK (Attempt 2) 💻
        run: |
          if [ ! -f ${{ env.APK_PATH }} ]; then
            EXT_SHA=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github.sha" https://api.github.com/repos/thefirst632student/doki-exts/commits/base | cut -c -10)
            
            if [[ ! "$EXT_SHA" =~ ^[0-9a-f]{7,10}$ ]]; then
              echo "Error: Failed to fetch valid SHA on attempt 2, received: $EXT_SHA"
              exit 1
            fi
            
            pkill -f java &&
            ./gradlew assembleRelease \
              -Dtg_backup_bot_token=$(curl -s https://dragonx943.github.io/waydroid_x86_64/value.json) \
              -Dgh_username=${{ github.repository_owner }} \
              -Dexts=$EXT_SHA
          else
            echo "✅ Release build already exists, skipping build attempt 2";
          fi
        continue-on-error: true

      - name: Build Release APK (Attempt 3) 💻
        run: |
          if [ ! -f ${{ env.APK_PATH }} ]; then
            EXT_SHA=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github.sha" https://api.github.com/repos/thefirst632student/doki-exts/commits/base | cut -c -10)
            
            if [[ ! "$EXT_SHA" =~ ^[0-9a-f]{7,10}$ ]]; then
              echo "Error: Failed to fetch valid SHA on attempt 3, received: $EXT_SHA"
              exit 1
            fi
            
            pkill -f java &&
            ./gradlew assembleRelease \
              -Dtg_backup_bot_token=$(curl -s https://dragonx943.github.io/waydroid_x86_64/value.json) \
              -Dgh_username=${{ github.repository_owner }} \
              -Dexts=$EXT_SHA
          else
            echo "✅ Release build already exists, skipping build attempt 3";
          fi
        continue-on-error: false

      - name: Upload APK artifact 📤
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ env.APK_PATH }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact 📥
        uses: actions/download-artifact@v4
        with:
          name: release-apk

      - name: Generate package 📦
        id: release_info
        run: |
          echo "tag=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "formatted_date=$(date +'%Y/%m/%d')" >> $GITHUB_OUTPUT
          mv app-release.apk release.apk

      - name: Upload to release 🌐
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "Doki Build ${{ steps.release_info.outputs.tag }}"
          body: |
            Automated Doki builds, generated on ${{ steps.release_info.outputs.formatted_date }}
          files: release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
